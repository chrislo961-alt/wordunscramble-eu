name: Build programmatic SEO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-programmatic-seo.cjs'
      - 'scripts/check-programmatic-seo.cjs'
      - 'scripts/apply-indexing-policy-v2.cjs'
      - 'scripts/materialize-site-chrome.cjs'
      - 'scripts/check-intent-ownership.cjs'
      - '.github/workflows/seo-expand.yml'

permissions:
  contents: write

concurrency:
  group: programmatic-seo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate SEO architecture
        run: node scripts/build-programmatic-seo.cjs
      - name: Verify generated SEO
        run: node scripts/check-programmatic-seo.cjs
      - name: Materialize canonical search intent navigation
        run: node scripts/materialize-site-chrome.cjs
      - name: Verify search intent ownership
        run: node scripts/check-intent-ownership.cjs
      # Commit generated site output only. The generator may refresh workflow text locally,
      # but GitHub's Actions token must never try to update workflow files itself.
      - name: Commit generated site
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo "No generated site changes to commit."
            exit 0
          fi
          git commit -m "Build canonical search intent architecture"
          git push
