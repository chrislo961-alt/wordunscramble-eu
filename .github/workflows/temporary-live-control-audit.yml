name: Temporary WordUnscramble.eu live control audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install audit tools
        run: npm install --no-save cheerio@1.0.0 lighthouse@12.8.2 playwright-core@1.55.0

      - name: Audit live endpoints, sitemap pages, metadata and repository coverage
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import * as cheerio from 'cheerio';

          const BASE = 'https://wordunscramble.eu';
          const EXPECTED_PUBLISHER = 'pub-9212084765206199';
          const findings = { failures: [], warnings: [], notes: [] };
          const pages = [];

          function add(level, message) {
            findings[level].push(message);
            const prefix = level === 'failures' ? 'FAIL' : level === 'warnings' ? 'WARN' : 'NOTE';
            console.log(`${prefix}: ${message}`);
          }

          function normalizeUrl(value) {
            const url = new URL(value, BASE);
            url.hash = '';
            url.hostname = url.hostname.toLowerCase();
            if (url.pathname !== '/' && !url.pathname.endsWith('/')) url.pathname += '/';
            return url.toString();
          }

          function normalizePath(value) {
            const url = new URL(value, BASE);
            let pathname = url.pathname;
            if (pathname !== '/' && !pathname.endsWith('/')) pathname += '/';
            return pathname;
          }

          async function request(url, options = {}) {
            const response = await fetch(url, {
              redirect: options.redirect ?? 'follow',
              signal: AbortSignal.timeout(options.timeout ?? 30000),
              headers: {
                'user-agent': options.userAgent ?? 'Mozilla/5.0 (compatible; WordUnscramble-Control-Audit/1.0)',
                accept: options.accept ?? '*/*',
              },
            });
            const buffer = options.body === false ? Buffer.alloc(0) : Buffer.from(await response.arrayBuffer());
            return { response, buffer, text: buffer.toString('utf8') };
          }

          async function mapLimit(items, limit, worker) {
            const output = new Array(items.length);
            let cursor = 0;
            const runners = Array.from({ length: Math.min(limit, Math.max(items.length, 1)) }, async () => {
              while (true) {
                const index = cursor++;
                if (index >= items.length) return;
                output[index] = await worker(items[index], index);
              }
            });
            await Promise.all(runners);
            return output;
          }

          console.log('=== CANONICAL HOST REDIRECTS ===');
          for (const source of [
            'http://wordunscramble.eu/',
            'https://www.wordunscramble.eu/',
            'http://www.wordunscramble.eu/',
          ]) {
            try {
              const { response } = await request(source, { redirect: 'manual', body: false });
              const location = response.headers.get('location') || '';
              console.log(`${source} -> ${response.status} ${location}`);
              if (![301, 302, 307, 308].includes(response.status)) {
                add('failures', `${source} returns ${response.status} instead of redirecting`);
              } else if (!location.startsWith('https://wordunscramble.eu')) {
                add('failures', `${source} redirects outside the canonical HTTPS apex host: ${location}`);
              }
            } catch (error) {
              add('failures', `${source} could not be checked: ${error.message}`);
            }
          }

          console.log('\n=== CORE PUBLIC ENDPOINTS ===');
          const endpointDefinitions = [
            ['/robots.txt', /text\/plain/i, true],
            ['/sitemap.xml', /(xml|text\/plain)/i, true],
            ['/ads.txt', /text\/plain/i, true],
            ['/favicon.ico', /image\//i, false],
            ['/apple-touch-icon.png', /image\//i, false],
            ['/manifest.webmanifest', /(manifest|json)/i, false],
            ['/assets/style.css', /text\/css/i, true],
            ['/assets/app.js', /(javascript|text\/plain)/i, true],
          ];
          const endpointData = new Map();
          for (const [pathname, expectedType, required] of endpointDefinitions) {
            try {
              const { response, buffer, text } = await request(`${BASE}${pathname}`);
              const contentType = response.headers.get('content-type') || '';
              endpointData.set(pathname, { response, buffer, text });
              console.log(`${pathname}: ${response.status}, ${contentType || 'no content-type'}, ${buffer.length} bytes`);
              if (required && response.status !== 200) add('failures', `${pathname} returned HTTP ${response.status}`);
              if (!required && response.status !== 200) add('warnings', `${pathname} is missing or unavailable (HTTP ${response.status})`);
              if (response.status === 200 && !expectedType.test(contentType)) {
                add('warnings', `${pathname} has unexpected content type: ${contentType || 'missing'}`);
              }
              if (required && buffer.length === 0) add('failures', `${pathname} is empty`);
            } catch (error) {
              add(required ? 'failures' : 'warnings', `${pathname} could not be fetched: ${error.message}`);
            }
          }

          const robots = endpointData.get('/robots.txt')?.text || '';
          if (!/User-agent:\s*\*/i.test(robots)) add('failures', 'robots.txt has no wildcard user-agent section');
          if (/^\s*Disallow:\s*\/\s*$/im.test(robots)) add('failures', 'robots.txt blocks the entire site');
          if (!/Sitemap:\s*https:\/\/wordunscramble\.eu\/sitemap\.xml/i.test(robots)) {
            add('failures', 'robots.txt does not declare the canonical sitemap URL');
          }
          if (/Content-Signal:/i.test(robots)) {
            add('notes', 'Cloudflare Content-Signal is present in live robots.txt and may lower Lighthouse SEO despite not blocking Googlebot');
          }

          const ads = endpointData.get('/ads.txt')?.text || '';
          if (!ads.includes(EXPECTED_PUBLISHER)) add('failures', `ads.txt does not contain ${EXPECTED_PUBLISHER}`);
          if (!/google\.com\s*,\s*pub-9212084765206199\s*,\s*DIRECT\s*,\s*f08c47fec0942fa0/i.test(ads)) {
            add('failures', 'ads.txt does not contain the complete authorized Google seller line');
          }

          for (let length = 2; length <= 15; length += 1) {
            const pathname = `/data/w${length}.txt`;
            try {
              const { response, buffer, text } = await request(`${BASE}${pathname}`);
              const count = text.trim() ? text.trim().split(/\s+/).length : 0;
              console.log(`${pathname}: ${response.status}, ${buffer.length} bytes, ${count} words`);
              if (response.status !== 200) add('failures', `${pathname} returned HTTP ${response.status}`);
              if (count === 0) add('failures', `${pathname} contains no words`);
            } catch (error) {
              add('failures', `${pathname} could not be fetched: ${error.message}`);
            }
          }

          console.log('\n=== LIVE SITEMAP ===');
          const sitemapText = endpointData.get('/sitemap.xml')?.text || '';
          const sitemapUrls = [...sitemapText.matchAll(/<loc>([^<]+)<\/loc>/gi)].map((match) => match[1].trim());
          console.log(`Live sitemap URL count: ${sitemapUrls.length}`);
          if (sitemapUrls.length === 0) add('failures', 'live sitemap has no URLs');
          if (new Set(sitemapUrls).size !== sitemapUrls.length) add('failures', 'live sitemap contains duplicate URLs');
          for (const url of sitemapUrls) {
            if (!url.startsWith(`${BASE}/`) && url !== `${BASE}/`) add('failures', `sitemap contains non-canonical host: ${url}`);
            if (normalizeUrl(url) !== url) add('warnings', `sitemap URL is not normalized with the preferred trailing slash: ${url}`);
          }

          const repoSitemap = fs.readFileSync('sitemap.xml', 'utf8');
          const repoUrls = [...repoSitemap.matchAll(/<loc>([^<]+)<\/loc>/gi)].map((match) => match[1].trim());
          const liveSet = new Set(sitemapUrls.map(normalizeUrl));
          const repoSet = new Set(repoUrls.map(normalizeUrl));
          const missingLive = [...repoSet].filter((url) => !liveSet.has(url));
          const extraLive = [...liveSet].filter((url) => !repoSet.has(url));
          if (missingLive.length || extraLive.length) {
            add('warnings', `live sitemap differs from main: ${missingLive.length} missing live, ${extraLive.length} extra live`);
          } else {
            add('notes', `live sitemap matches the repository (${repoUrls.length} URLs)`);
          }

          console.log('\n=== SITEMAP PAGE AUDIT ===');
          const titleMap = new Map();
          const descriptionMap = new Map();
          const discoveredInternalUrls = new Set(sitemapUrls.map(normalizeUrl));
          const assetUrls = new Set();

          await mapLimit(sitemapUrls, 8, async (url) => {
            try {
              const { response, text: html } = await request(url, { accept: 'text/html' });
              const finalUrl = response.url;
              const contentType = response.headers.get('content-type') || '';
              const $ = cheerio.load(html);
              const title = $('title').first().text().replace(/\s+/g, ' ').trim();
              const description = $('meta[name="description"]').attr('content')?.trim() || '';
              const robotsMeta = $('meta[name="robots"]').attr('content')?.trim() || '';
              const canonicalRaw = $('link[rel="canonical"]').attr('href')?.trim() || '';
              const canonical = canonicalRaw ? new URL(canonicalRaw, finalUrl).toString() : '';
              const viewport = $('meta[name="viewport"]').attr('content')?.trim() || '';
              const lang = $('html').attr('lang')?.trim() || '';
              const h1Count = $('h1').length;
              const h2Count = $('h2').length;
              const ogTitle = $('meta[property="og:title"]').attr('content')?.trim() || '';
              const ogDescription = $('meta[property="og:description"]').attr('content')?.trim() || '';
              const ogUrl = $('meta[property="og:url"]').attr('content')?.trim() || '';
              const jsonLdCount = $('script[type="application/ld+json"]').length;
              const adsenseMeta = $('meta[name="google-adsense-account"]').attr('content')?.trim() || '';
              const adsenseScripts = $('script[src*="pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"]').length;
              const externalStylesheets = $('link[rel~="stylesheet"]').length;
              const textLength = $('body').text().replace(/\s+/g, ' ').trim().length;
              const xRobots = response.headers.get('x-robots-tag') || '';

              $('a[href]').each((_, node) => {
                const href = $(node).attr('href');
                if (!href || /^(mailto:|tel:|javascript:|#)/i.test(href)) return;
                try {
                  const linked = new URL(href, finalUrl);
                  if (linked.hostname !== 'wordunscramble.eu' && linked.hostname !== 'www.wordunscramble.eu') return;
                  if (/\.(?:png|jpe?g|gif|webp|svg|ico|css|js|xml|txt|json|webmanifest|pdf|zip)$/i.test(linked.pathname)) return;
                  discoveredInternalUrls.add(normalizeUrl(linked.toString()));
                } catch {}
              });
              $('[src], link[href]').each((_, node) => {
                const value = $(node).attr('src') || $(node).attr('href');
                if (!value) return;
                try {
                  const linked = new URL(value, finalUrl);
                  if (linked.hostname === 'wordunscramble.eu' || linked.hostname === 'www.wordunscramble.eu') {
                    assetUrls.add(linked.toString());
                  }
                } catch {}
              });

              const item = {
                url,
                status: response.status,
                finalUrl,
                contentType,
                title,
                description,
                robotsMeta,
                canonical,
                viewport,
                lang,
                h1Count,
                h2Count,
                ogTitle,
                ogDescription,
                ogUrl,
                jsonLdCount,
                adsenseMeta,
                adsenseScripts,
                externalStylesheets,
                textLength,
                htmlLength: html.length,
              };
              pages.push(item);

              if (response.status !== 200) add('failures', `${url} returned HTTP ${response.status}`);
              if (!/text\/html/i.test(contentType)) add('failures', `${url} is not served as HTML: ${contentType}`);
              if (normalizeUrl(finalUrl) !== normalizeUrl(url)) add('failures', `${url} redirects to ${finalUrl} but is listed in the sitemap`);
              if (!title) add('failures', `${url} has no title`);
              else if (title.length < 20 || title.length > 70) add('warnings', `${url} title length is ${title.length}: ${title}`);
              if (!description) add('failures', `${url} has no meta description`);
              else if (description.length < 70 || description.length > 180) add('warnings', `${url} description length is ${description.length}`);
              if (!canonical) add('failures', `${url} has no canonical link`);
              else if (normalizeUrl(canonical) !== normalizeUrl(url)) add('failures', `${url} canonical points to ${canonical}`);
              if (/noindex/i.test(robotsMeta) || /noindex/i.test(xRobots)) add('failures', `${url} is marked noindex despite being in the sitemap`);
              if (!viewport) add('failures', `${url} has no viewport meta tag`);
              if (!lang) add('failures', `${url} has no html lang attribute`);
              if (h1Count !== 1) add('failures', `${url} has ${h1Count} H1 elements`);
              if (h2Count === 0) add('warnings', `${url} has no H2 headings`);
              if (!ogTitle || !ogDescription || !ogUrl) add('warnings', `${url} lacks complete Open Graph metadata`);
              if (jsonLdCount === 0) add('warnings', `${url} has no JSON-LD structured data`);
              if (adsenseMeta !== `ca-${EXPECTED_PUBLISHER}`) add('warnings', `${url} has no matching google-adsense-account meta tag`);
              if (adsenseScripts !== 1) add('warnings', `${url} has ${adsenseScripts} direct AdSense loader scripts`);
              if (textLength < 300) add('warnings', `${url} has only ${textLength} visible text characters`);

              if (title) titleMap.set(title.toLowerCase(), [...(titleMap.get(title.toLowerCase()) || []), url]);
              if (description) descriptionMap.set(description.toLowerCase(), [...(descriptionMap.get(description.toLowerCase()) || []), url]);
              console.log(`${response.status} ${url} | h1=${h1Count} | title=${title.length} | desc=${description.length} | text=${textLength} | jsonld=${jsonLdCount}`);
            } catch (error) {
              add('failures', `${url} audit failed: ${error.message}`);
            }
          });

          for (const [title, urls] of titleMap) {
            if (urls.length > 1) add('failures', `duplicate title on ${urls.length} sitemap pages: "${title}" -> ${urls.join(', ')}`);
          }
          for (const [description, urls] of descriptionMap) {
            if (urls.length > 1) add('warnings', `duplicate description on ${urls.length} sitemap pages -> ${urls.join(', ')}`);
          }

          console.log('\n=== REPOSITORY HTML COVERAGE ===');
          function walk(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              if (entry.name === '.git' || entry.name === 'node_modules') return [];
              const full = path.join(directory, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }
          const htmlFiles = walk('.').filter((file) => file === 'index.html' || file.endsWith(`${path.sep}index.html`));
          const repoRoutePaths = htmlFiles.map((file) => {
            if (file === 'index.html') return '/';
            return `/${file.slice(0, -'index.html'.length).split(path.sep).join('/')}`;
          });
          const sitemapPaths = new Set(sitemapUrls.map(normalizePath));
          const repoPaths = new Set(repoRoutePaths.map((value) => normalizePath(value)));
          const omittedRepoRoutes = [...repoPaths].filter((route) => !sitemapPaths.has(route)).sort();
          const missingRepoRoutes = [...sitemapPaths].filter((route) => !repoPaths.has(route)).sort();
          console.log(`Repository HTML routes: ${repoPaths.size}`);
          console.log(`Sitemap routes: ${sitemapPaths.size}`);
          console.log(`Repository routes omitted from sitemap: ${omittedRepoRoutes.length}`);
          console.log(`Sitemap routes without matching committed HTML: ${missingRepoRoutes.length}`);
          for (const route of omittedRepoRoutes.slice(0, 120)) console.log(`OMITTED: ${route}`);
          for (const route of missingRepoRoutes.slice(0, 120)) console.log(`MISSING-FILE: ${route}`);
          if (omittedRepoRoutes.length) add('warnings', `${omittedRepoRoutes.length} committed HTML routes are omitted from the sitemap`);
          if (missingRepoRoutes.length) add('failures', `${missingRepoRoutes.length} sitemap routes have no matching committed index.html`);

          console.log('\n=== INTERNAL LINK STATUS ===');
          const internalUrls = [...discoveredInternalUrls].sort();
          let brokenInternal = 0;
          await mapLimit(internalUrls, 12, async (url) => {
            try {
              const { response } = await request(url, { body: false, timeout: 25000 });
              if (response.status >= 400) {
                brokenInternal += 1;
                add('failures', `internal URL returned ${response.status}: ${url}`);
              }
            } catch (error) {
              brokenInternal += 1;
              add('failures', `internal URL failed: ${url} (${error.message})`);
            }
          });
          console.log(`Internal URLs checked: ${internalUrls.length}; broken: ${brokenInternal}`);

          console.log('\n=== FIRST-PARTY ASSET STATUS ===');
          const assets = [...assetUrls].sort();
          let brokenAssets = 0;
          await mapLimit(assets, 12, async (url) => {
            try {
              const { response } = await request(url, { body: false, timeout: 25000 });
              if (response.status >= 400) {
                brokenAssets += 1;
                add('failures', `first-party asset returned ${response.status}: ${url}`);
              }
            } catch (error) {
              brokenAssets += 1;
              add('failures', `first-party asset failed: ${url} (${error.message})`);
            }
          });
          console.log(`First-party assets checked: ${assets.length}; broken: ${brokenAssets}`);

          console.log('\n=== RESPONSE HEADERS ===');
          try {
            const { response } = await request(`${BASE}/`, { body: false });
            for (const name of [
              'strict-transport-security',
              'x-content-type-options',
              'referrer-policy',
              'permissions-policy',
              'content-security-policy',
              'x-frame-options',
              'cache-control',
            ]) {
              const value = response.headers.get(name);
              console.log(`${name}: ${value || 'MISSING'}`);
              if (!value) add('warnings', `homepage response is missing ${name}`);
            }
          } catch (error) {
            add('failures', `homepage headers could not be checked: ${error.message}`);
          }

          const report = {
            generatedAt: new Date().toISOString(),
            base: BASE,
            sitemapUrlCount: sitemapUrls.length,
            sitemapPagesAudited: pages.length,
            repositoryHtmlRouteCount: repoPaths.size,
            omittedRepoRoutes,
            missingRepoRoutes,
            internalUrlsChecked: internalUrls.length,
            firstPartyAssetsChecked: assets.length,
            findings,
            pages,
          };
          fs.writeFileSync('/tmp/wordunscramble-live-audit.json', JSON.stringify(report, null, 2));

          console.log('\n=== AUDIT SUMMARY ===');
          console.log(`Failures: ${findings.failures.length}`);
          console.log(`Warnings: ${findings.warnings.length}`);
          console.log(`Notes: ${findings.notes.length}`);
          console.log('This diagnostic step remains successful so the browser and Lighthouse checks always run.');
          NODE

      - name: Test representative pages and word tools in Chrome
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';

          const pagesToCheck = [
            '/',
            '/word-unscrambler/',
            '/word-finder/',
            '/anagram-solver/',
            '/5-letter-words/',
            '/5-letter-words-containing-a/',
            '/5-letter-words-starting-with-s/',
            '/words-with-q/',
            '/word-lists/',
            '/how-it-works/',
            '/about/',
            '/privacy/',
          ];
          const findings = [];
          const results = [];
          const browser = await chromium.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: ['--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage'],
          });

          async function inspect(pathname, width, height) {
            const context = await browser.newContext({
              viewport: { width, height },
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            });
            const page = await context.newPage();
            const consoleMessages = [];
            const failedRequests = [];
            page.on('console', (message) => {
              if (message.type() === 'error' || message.type() === 'warning') {
                consoleMessages.push(`${message.type()}: ${message.text()}`);
              }
            });
            page.on('pageerror', (error) => consoleMessages.push(`pageerror: ${error.message}`));
            page.on('requestfailed', (request) => {
              failedRequests.push(`${request.failure()?.errorText || 'failed'} ${request.url()}`);
            });

            let response;
            try {
              response = await page.goto(`https://wordunscramble.eu${pathname}`, {
                waitUntil: 'domcontentloaded',
                timeout: 60000,
              });
              await page.waitForTimeout(3500);
            } catch (error) {
              findings.push(`${pathname} @ ${width}px did not load: ${error.message}`);
              await context.close();
              return;
            }

            const state = await page.evaluate(() => {
              const canonical = document.querySelector('link[rel="canonical"]');
              const main = document.querySelector('main');
              return {
                title: document.title,
                canonical: canonical instanceof HTMLLinkElement ? canonical.href : '',
                h1Count: document.querySelectorAll('h1').length,
                bodyMargin: getComputedStyle(document.body).margin,
                clientWidth: document.documentElement.clientWidth,
                scrollWidth: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth),
                mainVisible: main instanceof HTMLElement && main.getBoundingClientRect().height > 0,
                textLength: document.body.innerText.trim().length,
                adsensePresent: Boolean(document.querySelector('script[src*="pagead2.googlesyndication.com"]')),
                stylesheetCount: document.querySelectorAll('link[rel~="stylesheet"]').length,
              };
            });

            const firstPartyFailed = failedRequests.filter((entry) => /https:\/\/(?:www\.)?wordunscramble\.eu/i.test(entry));
            console.log(`${pathname} @ ${width}x${height}: status=${response?.status()} h1=${state.h1Count} overflow=${state.scrollWidth - state.clientWidth}px console=${consoleMessages.length} failed=${failedRequests.length}`);
            if (consoleMessages.length) console.log(consoleMessages.slice(0, 20).join('\n'));
            if (failedRequests.length) console.log(failedRequests.slice(0, 20).join('\n'));

            if (response?.status() !== 200) findings.push(`${pathname} @ ${width}px returned ${response?.status()}`);
            if (!state.title) findings.push(`${pathname} @ ${width}px has no title`);
            if (!state.canonical) findings.push(`${pathname} @ ${width}px has no canonical`);
            if (state.h1Count !== 1) findings.push(`${pathname} @ ${width}px has ${state.h1Count} H1 elements`);
            if (!state.mainVisible) findings.push(`${pathname} @ ${width}px has no visible main content`);
            if (state.textLength < 150) findings.push(`${pathname} @ ${width}px has only ${state.textLength} visible text characters`);
            if (state.scrollWidth > state.clientWidth + 1) findings.push(`${pathname} has horizontal overflow at ${width}px`);
            if (state.bodyMargin !== '0px') findings.push(`${pathname} application CSS did not apply at ${width}px`);
            if (firstPartyFailed.length) findings.push(`${pathname} had ${firstPartyFailed.length} failed first-party requests at ${width}px`);
            if (!state.adsensePresent) findings.push(`${pathname} did not contain the AdSense loader at ${width}px`);

            results.push({ pathname, width, height, status: response?.status(), state, consoleMessages, failedRequests });
            await context.close();
          }

          for (const pathname of pagesToCheck) {
            await inspect(pathname, 390, 844);
            await inspect(pathname, 1365, 900);
          }

          console.log('\n=== WORD TOOL FUNCTIONAL TESTS ===');
          const context = await browser.newContext({
            viewport: { width: 1365, height: 900 },
            userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
          });
          const page = await context.newPage();
          const toolConsole = [];
          const toolFailed = [];
          page.on('console', (message) => {
            if (message.type() === 'error' || message.type() === 'warning') toolConsole.push(`${message.type()}: ${message.text()}`);
          });
          page.on('pageerror', (error) => toolConsole.push(`pageerror: ${error.message}`));
          page.on('requestfailed', (request) => toolFailed.push(`${request.failure()?.errorText || 'failed'} ${request.url()}`));

          const response = await page.goto('https://wordunscramble.eu/', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.fill('#letters', 'stare');
          await page.click('#go');
          await page.waitForFunction(() => {
            const count = document.querySelector('#count')?.textContent || '';
            return /word(s)? found/i.test(count);
          }, { timeout: 30000 });
          const firstSearch = await page.evaluate(() => ({
            count: document.querySelector('#count')?.textContent || '',
            words: [...document.querySelectorAll('.word [data-word], .word')].map((node) => node.getAttribute('data-word') || node.textContent?.trim().split(/\s+/)[0] || '').filter(Boolean).slice(0, 80),
            url: location.href,
          }));
          console.log('stare search:', JSON.stringify(firstSearch));
          if (!firstSearch.words.includes('stare')) findings.push('Unscrambler search for stare did not include stare');
          if (!firstSearch.url.includes('letters=stare')) findings.push('Unscrambler did not update the URL with letters=stare');

          await page.fill('#starts', 's');
          await page.selectOption('#length', '5');
          await page.waitForTimeout(1000);
          const filtered = await page.evaluate(() => ({
            count: document.querySelector('#count')?.textContent || '',
            words: [...document.querySelectorAll('.word')].map((node) => node.getAttribute('data-word') || '').filter(Boolean),
          }));
          console.log('filtered search:', JSON.stringify({ count: filtered.count, sample: filtered.words.slice(0, 30) }));
          if (filtered.words.some((word) => word.length !== 5 || !word.startsWith('s'))) {
            findings.push('Starts-with and exact-length filters returned a word outside the requested pattern');
          }

          await page.fill('#letters', 'sta?e');
          await page.fill('#starts', '');
          await page.selectOption('#length', '5');
          await page.click('#go');
          await page.waitForTimeout(1000);
          const wildcard = await page.evaluate(() => [...document.querySelectorAll('.word')].map((node) => node.getAttribute('data-word') || '').filter(Boolean));
          console.log('wildcard sample:', wildcard.slice(0, 30));
          if (wildcard.length === 0) findings.push('Wildcard search produced no results');

          console.log(`Tool console messages: ${toolConsole.length}; failed requests: ${toolFailed.length}`);
          if (toolConsole.length) console.log(toolConsole.join('\n'));
          if (toolFailed.length) console.log(toolFailed.join('\n'));
          const firstPartyToolFailures = toolFailed.filter((entry) => /wordunscramble\.eu/i.test(entry));
          if (firstPartyToolFailures.length) findings.push(`Word tool had ${firstPartyToolFailures.length} failed first-party requests`);
          await context.close();
          await browser.close();

          fs.writeFileSync('/tmp/wordunscramble-browser-audit.json', JSON.stringify({ findings, results, toolConsole, toolFailed }, null, 2));
          console.log(`Browser audit findings: ${findings.length}`);
          for (const finding of findings) console.log(`FINDING: ${finding}`);
          NODE

      - name: Verify AdSense visibility for normal and Mediapartners browsers
        run: |
          for agent in normal mediapartners; do
            if [ "$agent" = "mediapartners" ]; then
              USER_AGENT='Mediapartners-Google'
            else
              USER_AGENT='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
            fi

            google-chrome \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --disable-blink-features=AutomationControlled \
              --user-agent="$USER_AGENT" \
              --virtual-time-budget=8000 \
              --dump-dom \
              https://wordunscramble.eu/ \
              > "/tmp/$agent-wordunscramble.html" 2> "/tmp/$agent-wordunscramble.stderr" || true
          done

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = {};
          for (const name of ['normal', 'mediapartners']) {
            const html = fs.readFileSync(`/tmp/${name}-wordunscramble.html`, 'utf8');
            const stderr = fs.readFileSync(`/tmp/${name}-wordunscramble.stderr`, 'utf8');
            const adsense = /<script[^>]+src=["'][^"']*pagead2\.googlesyndication\.com/i.test(html);
            const accountMeta = /google-adsense-account[^>]+ca-pub-9212084765206199/i.test(html);
            result[name] = { adsense, accountMeta, htmlLength: html.length, stderr: stderr.slice(0, 5000) };
            console.log(`${name}: adsense=${adsense} accountMeta=${accountMeta} html=${html.length}`);
          }
          fs.writeFileSync('/tmp/wordunscramble-adsense-audit.json', JSON.stringify(result, null, 2));
          NODE

      - name: Run Lighthouse on homepage and word-list page
        run: |
          for target in home wordlist; do
            if [ "$target" = "home" ]; then
              URL='https://wordunscramble.eu/'
            else
              URL='https://wordunscramble.eu/5-letter-words/'
            fi
            npx lighthouse "$URL" \
              --output=json \
              --output-path="/tmp/wordunscramble-lighthouse-$target.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage" \
              --quiet || true
          done

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const target of ['home', 'wordlist']) {
            const file = `/tmp/wordunscramble-lighthouse-${target}.json`;
            if (!fs.existsSync(file)) {
              console.log(`${target}: Lighthouse report missing`);
              continue;
            }
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const score = (name) => Math.round((report.categories[name]?.score || 0) * 100);
            console.log(`=== LIGHTHOUSE ${target.toUpperCase()} ===`);
            console.log(`URL: ${report.finalDisplayedUrl || report.finalUrl}`);
            console.log(`Performance: ${score('performance')}`);
            console.log(`Accessibility: ${score('accessibility')}`);
            console.log(`Best practices: ${score('best-practices')}`);
            console.log(`SEO: ${score('seo')}`);
            for (const id of [
              'first-contentful-paint',
              'largest-contentful-paint',
              'speed-index',
              'total-blocking-time',
              'cumulative-layout-shift',
              'render-blocking-resources',
              'errors-in-console',
              'robots-txt',
              'is-crawlable',
              'tap-targets',
              'color-contrast',
              'unused-css-rules',
              'unused-javascript',
              'third-party-cookies',
            ]) {
              const audit = report.audits[id];
              if (!audit) continue;
              console.log(`${id}: score=${audit.score} value=${audit.displayValue || audit.numericValue || ''}`);
              for (const item of (audit.details?.items || []).slice(0, 12)) console.log(JSON.stringify(item));
            }
          }
          NODE

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordunscramble-live-control-audit
          path: |
            /tmp/wordunscramble-live-audit.json
            /tmp/wordunscramble-browser-audit.json
            /tmp/wordunscramble-adsense-audit.json
            /tmp/wordunscramble-lighthouse-home.json
            /tmp/wordunscramble-lighthouse-wordlist.json
          if-no-files-found: warn
          retention-days: 7
