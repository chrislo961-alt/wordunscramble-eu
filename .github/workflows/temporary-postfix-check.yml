name: Temporary post-fix live check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deploy
        run: sleep 45
      - name: Check live site
        run: |
          set -e
          echo 'HTTPS homepage:'
          curl -sSI https://wordunscramble.eu/ | head -30
          echo 'HTTP homepage:'
          curl -sSI http://wordunscramble.eu/ | head -20
          echo 'WWW homepage:'
          curl -sSI https://www.wordunscramble.eu/ | head -20
          echo 'Favicon:'
          curl -sSI https://wordunscramble.eu/favicon.ico | head -20
          echo 'Manifest:'
          curl -sSI https://wordunscramble.eu/manifest.webmanifest | head -20
          echo 'Homepage metadata:'
          curl -fsSL https://wordunscramble.eu/ | grep -Eo 'og:title|application/ld\+json|manifest.webmanifest|favicon.svg' | sort -u
          echo 'Tool smoke test assets:'
          curl -fsS https://wordunscramble.eu/assets/app.js >/dev/null
          curl -fsS https://wordunscramble.eu/data/w5.txt >/dev/null
