name: SEO integrity

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - 'sitemap*.xml'
      - 'robots.txt'
      - 'functions/**'
      - 'data/programmatic-seo-routes.json'
      - 'scripts/check-programmatic-seo.cjs'
      - 'scripts/materialize-site-chrome.cjs'
      - 'scripts/check-intent-ownership.cjs'
      - '.github/workflows/seo-integrity.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check programmatic SEO integrity
        run: node scripts/check-programmatic-seo.cjs
      - name: Materialize canonical search intent navigation
        run: node scripts/materialize-site-chrome.cjs
      - name: Check search intent ownership
        run: node scripts/check-intent-ownership.cjs
